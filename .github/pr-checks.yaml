name: PR checks

on: [push]

jobs:
  checks:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v3
      - name: Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: ^18.18.0
      - name: Install yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn --no-cache --no-progress --non-interactive --frozen-lockfile
      - name: Lint
        run: yarn --non-interactive lint
      - name: Build
        run: yarn --non-interactive build
      - name: Test
        run: yarn --non-interactive test
      - name: Uninstall yarn
        if: always()
        run: npm uninstall -g yarn
