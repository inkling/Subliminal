name: Publish to JFrog
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master
    types: [synchronize]

jobs:
  publish:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v3

      - name: Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: ^18.18.0

      - name: Install yarn
        run: npm install -g yarn

      # - name: Pre-install
      #   run: rm -rf node_modules && yarn config set "strict-ssl" false -g

      - name: Bump package.json version and commit magic ccc
        run: |
          cd packages/client
          npm version patch --no-git-tag-version
          echo "CLIENT_VERSION=$(jq '.version' packages/client/package.json | tr -d '"')" >> $GITHUB_ENV
          echo "Publishing version $CLIENT_VERSION"

      - name: Setup .npmrc
        run: |
          npm config set "@echo360:registry" "https://inkling.jfrog.io/artifactory/api/npm/echo360/"
          npm config set "//inkling.jfrog.io/artifactory/api/npm/echo360/:_authToken" $NPM_JFROG_AUTH_TOKEN
        env:
          NPM_JFROG_AUTH_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: Install dependencies
        run: yarn --no-cache --no-progress --non-interactive --frozen-lockfile

      - name: Build
        run: yarn --non-interactive build

      - name: Publish Client
        run: yarn workspace @inkling/magicbell-client publish --non-interactive

      - name: Publish Server
        run: yarn workspace @inkling/magicbell-server publish --non-interactive
